<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Mutter — Play 그래픽 이미지 1024x500</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }

  /* Mutter 브랜드 팔레트 (uicomponent/theme/Color.kt) */
  :root {
    --ivory:     #FFFDF2;
    --gold-soft: #F7E8F1;
    --gold-light:#FFE0C7;
    --gold:      #C77BAE;
    --gold-deep: #8E4E7E;
    --ink:       #221D14;
    --ink-soft:  #6E6555;
    --peri:      #CFCBF5;
  }

  .stage {
    position: relative;
    width: 1024px; height: 500px;
    /* 흰 아이콘 타일이 묻히지 않도록 좌측부터 살짝 채도를 준다 */
    background: linear-gradient(108deg, #FCF1F6 0%, #F6E7F1 44%, #E7E2F6 100%);
    overflow: hidden;
  }

  /* 아이콘의 파스텔 톤을 반복하는 블러 블롭 */
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); }
  .blob-peach { width: 420px; height: 420px; background: var(--gold-light); opacity: .55; top: -150px; left: 470px; }
  .blob-pink  { width: 380px; height: 380px; background: #F9C9E1;           opacity: .45; bottom: -170px; left: 250px; }
  .blob-peri  { width: 460px; height: 460px; background: var(--peri);        opacity: .40; top: 90px;  right: -180px; }

  /* 전체를 가운데로 모아 좌우 여백을 균등하게 — Play가 양끝을 잘라도 안전하다 */
  .content {
    position: relative;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 48px;
    padding: 0 76px;
  }

  .icon {
    width: 188px; height: 188px;
    flex: 0 0 auto;
    border-radius: 44px;
    box-shadow: 0 20px 48px rgba(34, 29, 20, .18), 0 2px 6px rgba(34, 29, 20, .10);
  }

  .copy { display: flex; flex-direction: column; }

  .name {
    font-family: "AppleMyungjo", serif;
    font-size: 62px;
    line-height: 1.1;
    color: var(--ink);
    letter-spacing: 2px;
  }

  .tagline {
    margin-top: 18px;
    font-family: "Apple SD Gothic Neo", sans-serif;
    font-weight: 600;
    font-size: 33px;
    line-height: 1.35;
    color: var(--gold-deep);
    letter-spacing: -.5px;
  }

  .sub {
    margin-top: 14px;
    font-family: "Apple SD Gothic Neo", sans-serif;
    font-weight: 400;
    font-size: 21px;
    line-height: 1.5;
    color: var(--ink-soft);
    letter-spacing: -.3px;
  }

  /* 우측 여백의 점 — 아이콘 모티프 반복 */
  .dot { position: absolute; border-radius: 50%; }
  .dot-a { width: 18px; height: 18px; background: var(--gold-light); top: 104px; right: 118px; opacity: .95; }
  .dot-b { width: 12px; height: 12px; background: var(--peri);       top: 162px; right: 196px; opacity: .95; }
  .dot-c { width: 9px;  height: 9px;  background: var(--gold);       top: 372px; right: 146px; opacity: .5; }
  .dot-d { width: 13px; height: 13px; background: #F9C9E1;           top: 392px; left: 122px;  opacity: .8; }
  .dot-e { width: 8px;  height: 8px;  background: var(--peri);       top: 92px;  left: 168px;  opacity: .7; }
</style>
</head>
